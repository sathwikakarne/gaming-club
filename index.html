<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake & Jigsaw Puzzle Combo</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f0f0;
        margin: 0;
        padding: 0;
    }

    h1 {
        margin: 30px 0 20px;
        font-size: 2.5rem;
        font-weight: 800;
    }

    .button-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin: 0 auto 20px;
        flex-wrap: wrap;
    }

    .game-container {
        display: none;
        margin: 20px auto;
    }

    canvas {
        background: #000;
        display: block;
        margin: auto;
        border: 2px solid #333;
    }

    #puzzle {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
        gap: 2px;
        margin: auto;
    }

    .piece {
        width: 100px;
        height: 100px;
        background-size: 300px 300px;
        cursor: pointer;
        border: 1px solid #ccc;
    }

    button {
        margin: 0;
        padding: 12px 28px;
        font-size: 16px;
        border: 1px solid #bdbdbd;
        border-radius: 8px;
        background: #f3f3f3;
        color: #1a1a1a;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    button:hover {
        background: #e8e8e8;
    }
</style>
</head>
<body>

<h1>Snake & Jigsaw Puzzle Game</h1>
<div class="button-row">
    <button onclick="showGame('snake')">Play Snake</button>
    <button onclick="showGame('puzzle')">Play Puzzle</button>
</div>

<!-- Snake Game -->
<div id="snake" class="game-container">
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
</div>

<!-- Puzzle Game -->
<div id="puzzle" class="game-container"></div>

<script>
/* ===== Game Switcher ===== */
function showGame(game) {
    document.querySelectorAll('.game-container').forEach(div => div.style.display = 'none');
    document.getElementById(game).style.display = 'block';
    if (game === 'snake') startSnake();
    if (game === 'puzzle') startPuzzle();
}

/* ===== Snake Game ===== */
let snakeInterval;
function startSnake() {
    clearInterval(snakeInterval);
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const box = 20;
    let snake = [{x: 9 * box, y: 9 * box}];
    let direction = 'RIGHT';
    let food = {
        x: Math.floor(Math.random() * 20) * box,
        y: Math.floor(Math.random() * 20) * box
    };

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp' && direction !== 'DOWN') direction = 'UP';
        if (e.key === 'ArrowDown' && direction !== 'UP') direction = 'DOWN';
        if (e.key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT';
        if (e.key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
    });

    snakeInterval = setInterval(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw food
        ctx.fillStyle = 'red';
        ctx.fillRect(food.x, food.y, box, box);

        // Draw snake
        ctx.fillStyle = 'lime';
        snake.forEach(part => ctx.fillRect(part.x, part.y, box, box));

        // Snake movement
        let head = {...snake[0]};
        if (direction === 'UP') head.y -= box;
        if (direction === 'DOWN') head.y += box;
        if (direction === 'LEFT') head.x -= box;
        if (direction === 'RIGHT') head.x += box;

        // Game over conditions
        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
            snake.some(part => part.x === head.x && part.y === head.y)) {
            alert('Game Over!');
            clearInterval(snakeInterval);
            return;
        }

        // Eat food
        if (head.x === food.x && head.y === food.y) {
            food = {
                x: Math.floor(Math.random() * 20) * box,
                y: Math.floor(Math.random() * 20) * box
            };
        } else {
            snake.pop();
        }

        snake.unshift(head);
    }, 100);
}

/* ===== Puzzle Game ===== */
function startPuzzle() {
    const puzzleDiv = document.getElementById('puzzle');
    puzzleDiv.innerHTML = '';
    const imgURL = 'https://picsum.photos/300'; // Random image
    let pieces = [];

    // Create pieces
    for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
            let piece = document.createElement('div');
            piece.className = 'piece';
            piece.style.backgroundImage = `url(${imgURL})`;
            piece.style.backgroundPosition = `-${col * 100}px -${row * 100}px`;
            piece.dataset.correctPos = `${row}-${col}`;
            pieces.push(piece);
        }
    }

    // Shuffle pieces
    pieces.sort(() => Math.random() - 0.5);

    // Add click swap logic
    let selected = null;
    pieces.forEach(piece => {
        piece.addEventListener('click', () => {
            if (!selected) {
                selected = piece;
                piece.style.border = '2px solid blue';
            } else {
                let tempBG = selected.style.backgroundPosition;
                selected.style.backgroundPosition = piece.style.backgroundPosition;
                piece.style.backgroundPosition = tempBG;
                selected.style.border = '1px solid #ccc';
                selected = null;
                checkWin();
            }
        });
        puzzleDiv.appendChild(piece);
    });

    function checkWin() {
        let correct = true;
        let index = 0;
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
                if (pieces[index].style.backgroundPosition !== `-${col * 100}px -${row * 100}px`) {
                    correct = false;
                }
                index++;
            }
        }
        if (correct) {
            alert('Puzzle Completed!');
        }
    }
}
</script>
</body>
</html>
