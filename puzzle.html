<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎮 Puzzle Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #0b1020;
            color: white;
        }

        h1 {
            color: #00e5ff;
            margin-top: 30px;
        }

        p {
            color: #d5d9e8;
            font-size: 18px;
        }

        #puzzle {
            width: 400px;
            height: 400px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tile {
            display: flex;
            justify-content: center;
            align-items: center;

            background: #00e5ff;
            color: #07101c;

            font-size: 28px;
            font-weight: bold;

            border-radius: 10px;
            cursor: pointer;

            transition: 0.2s;
        }

        .tile:hover {
            transform: scale(1.05);
        }

        .empty {
            background: #151e3d;
            cursor: default;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;

            background: #00e5ff;
            color: #07101c;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        #message {
            font-size: 20px;
            color: #00e5ff;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            #puzzle {
                width: 90vw;
                height: 90vw;
            }

            .tile {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <h1>🧩 Puzzle Game</h1>

    <p>Arrange the numbers from 1 to 15!</p>

    <div id="puzzle"></div>

    <button onclick="shufflePuzzle()">🔄 New Game</button>

    <p id="moves">Moves: 0</p>

    <p id="message"></p>

    <script>

        let tiles = [];
        let moves = 0;

        function createPuzzle() {

            tiles = [];

            for (let i = 1; i <= 15; i++) {
                tiles.push(i);
            }

            tiles.push(0);

            shufflePuzzle();
        }

        function shufflePuzzle() {

            // Shuffle the tiles
            for (let i = 0; i < 200; i++) {

                let empty = tiles.indexOf(0);

                let possibleMoves = [];

                if (empty >= 4)
                    possibleMoves.push(empty - 4);

                if (empty < 12)
                    possibleMoves.push(empty + 4);

                if (empty % 4 !== 0)
                    possibleMoves.push(empty - 1);

                if (empty % 4 !== 3)
                    possibleMoves.push(empty + 1);

                let randomMove =
                    possibleMoves[
                        Math.floor(
                            Math.random() * possibleMoves.length
                        )
                    ];

                [tiles[empty], tiles[randomMove]] =
                [tiles[randomMove], tiles[empty]];
            }

            moves = 0;

            document.getElementById("message").textContent = "";

            drawPuzzle();
        }

        function drawPuzzle() {

            const puzzle =
                document.getElementById("puzzle");

            puzzle.innerHTML = "";

            tiles.forEach((number, index) => {

                const tile =
                    document.createElement("div");

                tile.classList.add("tile");

                if (number === 0) {

                    tile.classList.add("empty");

                } else {

                    tile.textContent = number;

                    tile.onclick = function() {
                        moveTile(index);
                    };
                }

                puzzle.appendChild(tile);
            });

            document.getElementById("moves").textContent =
                "Moves: " + moves;
        }

        function moveTile(index) {

            let empty = tiles.indexOf(0);

            let valid = false;

            // Up
            if (index === empty - 4)
                valid = true;

            // Down
            if (index === empty + 4)
                valid = true;

            // Left
            if (
                index === empty - 1 &&
                Math.floor(index / 4) === Math.floor(empty / 4)
            )
                valid = true;

            // Right
            if (
                index === empty + 1 &&
                Math.floor(index / 4) === Math.floor(empty / 4)
            )
                valid = true;

            if (valid) {

                [tiles[index], tiles[empty]] =
                [tiles[empty], tiles[index]];

                moves++;

                drawPuzzle();

                checkWin();
            }
        }

        function checkWin() {

            for (let i = 0; i < 15; i++) {

                if (tiles[i] !== i + 1) {
                    return;
                }
            }

            document.getElementById("message").textContent =
                "🎉 Congratulations! You solved the puzzle!";
        }

        createPuzzle();

    </script>

</body>
</html>
